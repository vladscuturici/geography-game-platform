<aside class="atlas-sidebar" aria-label="Main navigation">

  <a class="brand" routerLink="/home">
    <img
      class="brand__seal"
      src="./128.png"
      alt="According to the Legend"
      width="56"
      height="56"
    />
    <span class="brand__wordmark">
      <span class="brand__eyebrow">According to the</span>
      <span class="brand__name">Legend</span>
    </span>
  </a>

  <nav class="legend-key">
    <p class="legend-key__title">Map Key</p>

    <ul class="legend-key__list">
      @for (entry of entries; track entry.route) {
        <li class="legend-key__row">
          <a
            [routerLink]="entry.route"
            routerLinkActive="legend-key__link--active"
            class="legend-key__link"
          >
            <span class="legend-key__swatch" [attr.data-glyph]="entry.glyph">
              <svg viewBox="0 0 24 24" class="legend-key__icon">
                @switch (entry.glyph) {
                  @case ('globe') {
                    <g>
                      <circle cx="12" cy="12" r="9" />
                      <path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18" />
                    </g>
                  }
                  @case ('compass') {
                    <g>
                      <circle cx="12" cy="12" r="9" />
                      <path d="M15.5 8.5 13 13l-4.5 2.5L11 11z" />
                    </g>
                  }
                  @case ('pin') {
                    <g>
                      <path d="M12 21s-6.5-6.1-6.5-11A6.5 6.5 0 0 1 18.5 10c0 4.9-6.5 11-6.5 11z" />
                      <circle cx="12" cy="10" r="2.3" />
                    </g>
                  }
                  @case ('map') {
                    <g>
                        <path d="M9 3 3 5v16l6-2 6 2 6-2V3l-6 2-6-2Z" />
                        <path d="M9 3v16M15 5v16" />
                    </g>
                  }
                  @case ('language') {
                    <g>
                      <path d="M4 4h13a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H10l-4 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" />
                      <path d="M7 9h9M7 12.5h6" />
                    </g>
                  }
                  @case ('target') {
                    <g>
                      <circle cx="12" cy="12" r="8.5" />
                      <circle cx="12" cy="12" r="4.5" />
                      <path d="M12 3v3M12 18v3M3 12h3M18 12h3" />
                    </g>
                  }
                  @case ('grid') {
                    <g>
                      <rect x="3" y="3" width="18" height="18" rx="1.5" />
                      <path d="M9 3v18M15 3v18M3 9h18M3 15h18" />
                      <path d="M10.3 10.3l3.4 3.4M13.7 10.3l-3.4 3.4" />
                    </g>
                  }
                  @case ('updown') {
                    <g>
                      <path d="M7 10l5-5 5 5" />
                      <path d="M7 15l5 5 5-5" />
                    </g>
                  }
                  @case ('outline') {
                    <g>
                      <path d="M5 8.5c.6-1.8 2-2.7 3.4-2.3 1-1.4 3-1.7 4-.4 1.7-.6 3.4.3 3.6 1.9 1.7.3 2.6 1.8 2 3.3.9 1.1.7 2.6-.5 3.3.2 1.6-1 2.9-2.5 2.7-.6 1.5-2.4 2.1-3.7 1.2-1.3 1-3.1.8-4-.5-1.7.2-3-1-2.9-2.6-1.5-.5-2.1-2.1-1.3-3.5-.8-1.1-.5-2.7.9-3.1Z" />
                    </g>
                  }
                  @case ('sort') {
                    <g>
                      <path d="M4 18h4M4 13h8M4 8h12" />
                      <path d="M17 5v13M17 5l-3 3M17 5l3 3" />
                    </g>
                  }
                  @case ('book') {
                    <g>
                      <path d="M12 6.5c-1.7-1.3-3.9-2-6.2-2v12.5c2.3 0 4.5.7 6.2 2 1.7-1.3 3.9-2 6.2-2V4.5c-2.3 0-4.5.7-6.2 2Z" />
                      <path d="M12 6.5v12.5" />
                      <circle cx="12" cy="3" r="1.2" fill="currentColor" stroke="none" />
                    </g>
                  }
                  @case ('unknown') {
                    <g>
                      <circle cx="12" cy="12" r="9" />
                      <path d="M9.5 9a2.5 2.5 0 0 1 4.9.8c0 1.7-2.4 2-2.4 3.7" />
                      <circle cx="12" cy="17" r="0.1" fill="currentColor" stroke-width="2.4" />
                    </g>
                  }
                }
              </svg>
            </span>

            <span class="legend-key__text">
              <span class="legend-key__numeral">{{ entry.hint }}</span>
              <span class="legend-key__label">{{ entry.label }}</span>
            </span>

            <span class="legend-key__leader" aria-hidden="true"></span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="scale-bar" aria-hidden="true">
    <span class="scale-bar__tick"></span>
    <span class="scale-bar__tick"></span>
    <span class="scale-bar__tick"></span>
  </div>

</aside>
