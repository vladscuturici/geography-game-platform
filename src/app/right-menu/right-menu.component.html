  <div class="right-menu" aria-label="Contact and support">
    <div class="right-menu__wrap">
      <button
        type="button"
        class="right-menu__item right-menu__item--contact"
        (click)="toggleContactPopover()"
        [attr.aria-expanded]="showContactPopover"
      >
        <svg viewBox="0 0 24 24" class="right-menu__icon">
          <path d="M4 5.5h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-11a1 1 0 0 1 1-1Z" />
          <path d="m3.5 6 8.5 6.5L20.5 6" />
        </svg>
        <span>Report bugs / Contact</span>
      </button>

      @if (showContactPopover) {
      <div class="right-menu__popover">
        <span class="right-menu__popover-email">{{ contactEmail }}</span>
        <button type="button" class="right-menu__popover-copy" (click)="copyEmail($event)">
          {{ copyLabel }}
        </button>
      </div>
      }
    </div>

    <button type="button" class="right-menu__item right-menu__item--donate" (click)="openDonate()">
      <svg viewBox="0 0 24 24" class="right-menu__icon">
        <path d="M12 20.5S3.5 15.4 3.5 9.6A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8.5 2.6c0 5.8-8.5 10.9-8.5 10.9Z" />
      </svg>
      <span>Support the developer</span>
    </button>
  </div>
