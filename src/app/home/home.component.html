<div class="home">
  <header class="home__header">
    <div class="home__brand-tile">
      <img class="home__logo" src="logoandtext.png" alt="CompassLegend" />
    </div>
    <p class="home__tagline">A Geography Game Platform that tests how well you know the world. Play by yourself or invite a friend.</p>
  </header>

  <div class="home__map-wrap">
    <div class="home__map-bg--a"></div>
    <div class="home__map-bg--a-texture"></div>
    <div class="home__map-bg--b"></div>
    <div class="home__map-grain"></div>
    <div class="home__map-scrim"></div>

    <div class="tile-grid">
      @for (game of games; track game.title) {
        <button
          type="button"
          class="game-tile"
          [class.game-tile--locked]="!game.route"
          [disabled]="!game.route"
          (click)="onTileClick(game)"
        >
          <span class="game-tile__sheen"></span>
          <span class="game-tile__corner game-tile__corner--tl"></span>
          <span class="game-tile__corner game-tile__corner--br"></span>
          <div class="game-tile__icon">
            <svg viewBox="0 0 24 24" class="game-tile__glyph" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <g [innerHTML]="glyphSvg(game.glyph)"></g>
            </svg>
          </div>
          <div class="game-tile__name">{{ game.title }}</div>
          <div class="game-tile__desc">{{ game.description }}</div>

          @if (game.tags.length) {
            <div class="game-tile__tags">
              @for (tag of game.tags; track tag) {
                <span class="tag" [class]="'tag--' + tag">{{ tagLabel(tag) }}</span>
              }
            </div>
          }

          @if (!game.route) {
            <div class="game-tile__badge">Coming soon</div>
          }
        </button>
      }
    </div>
  </div>
</div>
